name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run the script tests
        run: python3 -m unittest discover -s tests/scripts -v

      - name: Check the package (versions, privacy, paths, dist)
        run: python3 scripts/validate.py

      - name: Check the skills CLI can find the skill
        run: npx --yes skills@1.7.1 add . --list

      - name: Check the Claude Code plugin
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.294
          claude plugin validate . --strict
