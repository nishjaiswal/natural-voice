name: Something isn't working
description: Natural Voice did something wrong, or wouldn't install.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't paste private writing or your voice file.** Describe what happened instead, or use a short made-up example.

  - type: input
    id: app
    attributes:
      label: Which app were you using?
      description: For example Claude Code, Claude app, ChatGPT, Codex, Gemini, Cursor, Copilot, Manus.
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Natural Voice?
      options:
        - Claude Code plugin
        - Uploaded the zip
        - Pasted the instructions file
        - npx skills add
        - Other or not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Natural Voice version
      description: Shown in the plugin list, or at the top of CHANGELOG.md when you downloaded it. "Not sure" is fine.
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked for, what you expected, and what you got instead. Copy any error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen?
      description: The steps, one per line, if you know them.
    validations:
      required: false
